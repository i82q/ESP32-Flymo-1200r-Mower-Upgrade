# automower.yaml - Flymo 1200R AUX1 bridge (ESP32 + MCP23017 + relays)
#
# Reference docs (this repo, docs/): hardware_build.md (wiring, relay map),
# aux1_protocol.md (protocol), keypad_and_menus.md (keys/menus).
# Requires aux1_protocol.h alongside this file.
#
# Hardware summary:
#   ESP32 powered from the mower battery via a 5V buck (AUX1 pin 6 NOT used).
#   AUX1 pin 1 (TX) -> GPIO16, pin 2 (RX) <- GPIO17, pin 3 -> GND.
#   AUX1 pin 5 (3.3V) -> 10k -> GPIO4 (100k to GND) = AUX1 awake sense.
#   Battery+ -> 100k -> GPIO34 -> 15k -> GND = pack voltage.
#   MCP23017 @0x27 (SDA 21, SCL 19) drives two active-low 8-relay boards.
#   Keys: relay NO contact across the keypad matrix pair.
#   Stop loop: board 2 relay 8 NC contact in series with the lid microswitch.
#   Energised = loop open = mower sees the hatch OPEN ("Automower Hatch").
#
# AUX1 traffic is gated in aux1_protocol.h: only while AUX1 is powered, 20s
# after it powers up (first-boot wizard guard), and while "AUX1 Polling" is on.
#
# Changes 5 Oct (draft, to test):
#   - Nightly top-up: wakes the docked mower once a night so it charges (it
#     does not charge in standby, and the ESP32 drains the pack ~0.6Ah/night).
#     Also checks the mower clock then and syncs it if it is >30s out (catches
#     drift and the BST change). Off by default: "Nightly Top-up" switch.
#   - ESP32 deep-sleep threshold 17V -> 17.5V.
#   - ESP32 SNTP every 6h instead of every 15 min (log noise).
#   - State 08 = "waiting for loop signal".
#   - Key engine: if the mower drops to standby while the hatch is open
#     mid-sequence, the sequence is replayed once from its '[' (with a wake).
#   - Timer control re-reads once before declaring a park/restore unconfirmed.
#   - Sync Time wakes the mower first instead of failing silently.
#   - Automower Last Fault: the mower's event record (Husqvarna fault code),
#     read automatically on each fault / loop-signal wait.
#   - A fault ongoing across an ESP reboot is no longer counted twice.
#   - Raw Response starts with the time it was received.
#   - Each AUX1 battery poll logs a paired raw ADC reading ("pair:") for
#     checking pack_multiplier below 19.8V.
#
# Changes 10 Oct:
#   - Skip Today button: HOME now, back to AUTO at 23:00 (skip_rearm_*; the
#     timer is not touched). Retried every 10 min, max 6. "Automower Skip"
#     shows the state. Mode Home / Auto / Man cancel a pending skip, so a
#     deliberate Home is never undone. Plain Mode Home is unchanged (sticky).
#   - Restore Timer check: with HOME selected the timer never reads "waiting"
#     and Next Start is only shown for a few seconds after the lid closes (9 Oct: six
#     "failed" restores that had all worked). A restore now counts as
#     confirmed when a next start is shown; with HOME selected it says so.
#     A park with HOME selected is reported as "can't be verified", not a fault.

substitutions:
  automower_pin: !secret automower_pin   # mower PIN, digits only (secrets.yaml)
  # Confirmed 28 Sep: 99 paired readings vs AUX1 battery mV (19.8-20.5V) agree
  # within +/-0.15V (mean ratio 1.001). The old 6.972 figure is obsolete.
  pack_multiplier: "7.57"
  # ESP32 self-protection only. Sleeps only when below this AND the mower is
  # off/standby (AUX1 unpowered), so it never cuts in while the mower is awake
  # and looking for the base (the mower heads home at ~18.1V on its own).
  battery_low_voltage: "17.5"
  battery_deep_sleep_duration: "1h"
  # Key timing (ms). The mower registers a key on RELEASE, so the gap after
  # release matters; 1000ms gives the display time to redraw between keys.
  key_press_ms: "250"
  key_gap_ms: "1000"
  key_hold_ms: "3000"   # 'r' (Home hold) and 'x' (7+9 hold)
  # Hatch emulation: pause after '[' / ']' before the next key.
  hatch_settle_ms: "1500"
  # Extra wait after '[' when the mower was in standby: AUX1 powers up in ~1s
  # but the screen takes a few seconds before it accepts keys.
  wake_wait_ms: "8500"   # + hatch_settle_ms 1500 = 10s total after a wake (measured 1 Oct)
  # Timer control (keypad_and_menus.md -> "Timer control"). Menu bodies only:
  # the ESP plays them wrapped as [r ... r s]. timer_normal is YOUR normal
  # schedule - keep it in step with the timer set on the mower, because
  # Restore Timer and the self-test write it back to the mower.
  timer_normal: "m1111001530o r m1200000000o r m13867b"   # WH1 11:00-15:30, WH2 off, Mon-Fri
  timer_park: "m138 1234567 b"                             # Work days: all on, then all toggled off
  timer_restore_hour: "23"                                 # auto restore time after a Park
  timer_restore_minute: "00"
  # Skip Today: when HOME is switched back to AUTO. Must be outside the work
  # hours, so AUTO just waits on the charger for the next start.
  skip_rearm_hour: "23"
  skip_rearm_minute: "00"
  # Nightly top-up (see the nightly_topup script).
  topup_hour: "2"
  topup_minute: "0"
  topup_skip_above: "20.2"      # V (pack ADC): skip the scheduled top-up if already this full
  clock_sync_threshold_s: "30"  # sync the mower clock if it is further out than this

esphome:
  name: automower
  friendly_name: Automower AUX1 Bridge
  includes:
    - aux1_protocol.h
  # Republish the last completed mow after a reboot (values live in flash).
  on_boot:
    priority: -100
    then:
      - script.execute: publish_last_mow
      - lambda: |-
          aux1::pub(id(automower_timer_control), id(timer_parked) ? "parked (restore pending)" : "normal timer");
          aux1::pub(id(automower_skip), id(skip_pending) ? "skipping - back to AUTO at ${skip_rearm_hour}:${skip_rearm_minute}" : "off");

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG   # DEBUG: changed poll replies + all commands; VERBOSE: every frame

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# MQTT: availability (LWT), the log stream and two command topics only.
# HA uses the native API for entities, so per-entity state topics are off
# (topic_prefix: null) - that was ~40 messages per poll cycle on top of the
# log, over a weak lawn WiFi link (suspected cause of the 28 Sep watchdog reset).
#   automower/status : online / offline (retained)
#   automower/debug  : log stream incl. AUX1 frames on change (capture log)
#   automower/cmd    : stop | start | home | manual | auto | search  (AUX1 0x0E)
#   automower/keys   : key sequence, same language as Keypad Menu Path
# NB: capture-log timestamps are HA receive times. After a WiFi stall, lines
# arrive in a burst, so short gaps in the log are not real key timing.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: false
  topic_prefix: null
  log_topic:
    topic: automower/debug
    level: DEBUG
    retain: false
  birth_message:
    topic: automower/status
    payload: "online"
    retain: true
  will_message:
    topic: automower/status
    payload: "offline"
    retain: true
  on_message:
    - topic: automower/cmd
      then:
        - lambda: |-
            int mode = aux1::mode_from_name(x);
            if (mode < 0) {
              ESP_LOGW("automower", "MQTT cmd '%s' not recognised", x.c_str());
              return;
            }
            aux1::set_mode(id(aux1_uart), (uint8_t) mode, id(automower_pin_global));
    - topic: automower/keys
      then:
        - script.execute:
            id: key_sequence
            seq: !lambda "return aux1::wrap_sequence(x);"   # [r ... r s] unless it starts with [ or !

uart:
  id: aux1_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 115200

i2c:
  id: relay_i2c
  sda: GPIO21
  scl: GPIO19
  scan: true

mcp23017:
  - id: relay_mcp
    address: 0x27

time:
  - platform: sntp
    id: sntp_time
    timezone: "GMT0BST,M3.5.0/1,M10.5.0"
    update_interval: 6h   # default is 15 min - ~96 log lines a day for nothing
    on_time:
      # Auto restore after a Park (see Timer control in keypad_and_menus.md).
      - hours: ${timer_restore_hour}
        minutes: ${timer_restore_minute}
        seconds: 0
        then:
          - if:
              condition:
                lambda: "return id(timer_parked) && id(timer_auto_restore).state;"
              then:
                - logger.log: {format: "Timer control: scheduled restore of the normal timer", tag: timer}
                - lambda: |-
                    id(restore_due) = true;
                    id(restore_attempts) = 0;
                - script.execute: {id: timer_apply, park: false}
      # Skip Today: back to AUTO (if a restore runs at the same time, the
      # re-arm waits for it).
      - hours: ${skip_rearm_hour}
        minutes: ${skip_rearm_minute}
        seconds: 0
        then:
          - if:
              condition:
                lambda: "return id(skip_pending);"
              then:
                - logger.log: {format: "Skip Today: scheduled switch back to AUTO", tag: skip}
                - lambda: |-
                    id(skip_due) = true;
                    id(skip_attempts) = 0;
                - script.execute: skip_rearm
      # Nightly top-up (only when the Nightly Top-up switch is on).
      - hours: ${topup_hour}
        minutes: ${topup_minute}
        seconds: 0
        then:
          - if:
              condition:
                lambda: "return id(nightly_topup_enabled).state;"
              then:
                - script.execute: {id: nightly_topup, manual: false}

deep_sleep:
  id: automower_deep_sleep

debug:
  update_interval: 60s

globals:
  - id: automower_pin_global
    type: uint16_t
    initial_value: "${automower_pin}"
  - id: key_buffer
    type: std::string
    initial_value: '""'
  - id: key_index
    type: int
    initial_value: "0"
  - id: key_hold_now
    type: uint32_t
    initial_value: "0"
  - id: key_gap_now
    type: uint32_t
    initial_value: "0"
  # Key engine: replays used for this sequence (max 1), and whether it was
  # aborted because the mower stayed asleep.
  - id: seq_replays
    type: int
    initial_value: "0"
  - id: seq_aborted
    type: bool
    initial_value: "false"

  # Mow day tracking. A session starts when 0x12 first shows mowing (02).
  # Docking to charge inside the timer's work period just counts a cycle; the
  # session ends once docked and the timer leaves the work period (or HOME is
  # selected). Faults and restarts stay in the same session. Kept in flash
  # (restore_value) so an ESP32 reset mid-mow doesn't lose it.
  - id: last_state_code
    type: uint8_t
    initial_value: "0"
  # Timer control. timer_parked = the Park sequence was sent and the normal
  # timer has not been confirmed back yet. restore_due = a restore is wanted
  # (scheduled time or button); retried every 10 min, max 6 attempts.
  - id: timer_parked
    type: bool
    restore_value: true
    initial_value: "false"
  - id: restore_due
    type: bool
    restore_value: true
    initial_value: "false"
  - id: restore_attempts
    type: int
    initial_value: "0"
  - id: tc_seq
    type: std::string
    initial_value: '""'
  - id: tc_park
    type: bool
    initial_value: "false"
  - id: tc_try
    type: int
    initial_value: "0"
  - id: tc_done
    type: bool
    initial_value: "false"
  # Keypad self-test.
  - id: st_ok
    type: bool
    initial_value: "true"
  - id: st_step
    type: int
    initial_value: "0"
  - id: st_seq
    type: std::string
    initial_value: '""'
  - id: st_report
    type: std::string
    initial_value: '""'
  - id: st_prev_timer
    type: uint8_t
    initial_value: "0xFF"
  # Skip Today. skip_pending = HOME was set by Skip Today and AUTO is still to
  # be restored (kept in flash). skip_due = the re-arm time has passed and the
  # switch back to AUTO is being attempted (retried every 10 min, max 6).
  - id: skip_pending
    type: bool
    restore_value: true
    initial_value: "false"
  - id: skip_due
    type: bool
    restore_value: true
    initial_value: "false"
  - id: skip_attempts
    type: int
    initial_value: "0"
  - id: sk_go
    type: bool
    initial_value: "false"
  - id: sk_try
    type: int
    initial_value: "0"
  - id: sk_done
    type: bool
    initial_value: "false"
  # Nightly top-up.
  - id: tu_skip
    type: std::string
    initial_value: '""'
  - id: tu_sync
    type: bool
    initial_value: "false"
  - id: tu_manual
    type: bool
    initial_value: "false"
  # Next Start: re-read the long 0x12 frame after each AUX1 wake and whenever
  # the state or b3 (mode/timer) changes.
  - id: next_start_dirty
    type: bool
    initial_value: "true"
  - id: last_b3
    type: uint8_t
    initial_value: "0xFF"
  # Adaptive polling (10s motor/tilt group).
  - id: motor_poll_active
    type: bool
    initial_value: "true"
  - id: quiet_tick
    type: int
    initial_value: "0"
  - id: mow_active
    type: bool
    restore_value: true
    initial_value: "false"
  - id: mow_start_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: mow_blade_sum
    type: float
    restore_value: true
    initial_value: "0"
  - id: mow_blade_n
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: mow_faults
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: mow_docked
    type: bool
    restore_value: true
    initial_value: "false"
  - id: mow_dock_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: mow_cycles
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Last completed mowing day.
  - id: last_mow_end_epoch
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: last_mow_minutes
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: last_mow_cut_minutes
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: last_mow_blade_ma
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: last_mow_faults
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: last_mow_cycles
    type: uint32_t
    restore_value: true
    initial_value: "0"

# ---------------------------------------------------------------------------
# Polling. One AUX1 query per group, fanned out to its entities.
# Every lambda returns early (no traffic) when the gate is closed.
# ---------------------------------------------------------------------------
interval:
  # Timer control retry: a wanted restore that hasn't been confirmed yet.
  - interval: 600s
    then:
      - if:
          condition:
            lambda: "return id(restore_due) && id(timer_parked) && !id(timer_apply).is_running() && !id(self_test).is_running() && !id(nightly_topup).is_running();"
          then:
            - if:
                condition:
                  lambda: "return id(restore_attempts) >= 6;"
                then:
                  - lambda: |-
                      id(restore_due) = false;
                      ESP_LOGW("timer", "Timer control: restore FAILED after 6 attempts - check the timer on the mower");
                      aux1::pub(id(automower_timer_control), "RESTORE FAILED - check the timer on the mower");
                else:
                  - script.execute: {id: timer_apply, park: false}

  # Skip Today retry: back to AUTO not confirmed yet.
  - interval: 600s
    then:
      - if:
          condition:
            lambda: "return id(skip_due) && id(skip_pending) && !id(skip_rearm).is_running() && !id(skip_today).is_running() && !id(timer_apply).is_running() && !id(self_test).is_running() && !id(nightly_topup).is_running();"
          then:
            - if:
                condition:
                  lambda: "return id(skip_attempts) >= 6;"
                then:
                  - lambda: |-
                      id(skip_due) = false;
                      id(skip_pending) = false;
                      ESP_LOGW("skip", "Skip Today: switch back to AUTO FAILED after 6 attempts - mower left in HOME");
                      aux1::pub(id(automower_skip), "FAILED - still in HOME, press Mode Auto");
                else:
                  - script.execute: skip_rearm

  # Traffic gate + standby state.
  - interval: 1s
    then:
      - lambda: |-
          bool was_awake = aux1::awake();
          bool now_awake = id(automower_aux1_awake).state;
          aux1::update_gate(now_awake, id(aux1_polling).state);
          if (was_awake && !now_awake) aux1::pub(id(automower_state), "standby");
          if (!was_awake && now_awake) id(next_start_dirty) = true;

  # 0x12 status (state code, fault, charging, diagnostic bytes).
  - interval: 30s
    then:
      - lambda: |-
          if (!aux1::ready()) return;
          uint8_t r[32];
          size_t len = aux1::send_command_authed(id(aux1_uart), 0x12, nullptr, 0, r, sizeof(r),
                                                 id(automower_pin_global));
          if (aux1::status_byte(r, len) != 0x00) return;
          const uint8_t *p = aux1::payload(r);
          size_t n = aux1::payload_len(r, len);
          if (n < 1) return;

          aux1::pub(id(automower_status_raw), aux1::hex_dump(p, n));
          id(automower_fault_active).publish_state(p[0] == 0x07);
          id(automower_charging).publish_state(p[0] == 0x04);
          // Decode (see aux1_protocol.md):
          //   b0 = state, b2 = mode actually running, b3 & 0x30 = mode selected.
          uint8_t run = n >= 3 ? p[2] : 0x00;
          switch (p[0]) {
            // 01 covers both parked on the base (charged) and stopped on the lawn.
            case 0x01: aux1::pub(id(automower_state), "idle"); break;
            case 0x02:
              if (run == 0x06) aux1::pub(id(automower_state), "mowing (auto)");
              else if (run == 0x07) aux1::pub(id(automower_state), "mowing (man)");
              else aux1::pub(id(automower_state), "mowing");
              break;
            case 0x03: aux1::pub(id(automower_state), "going home"); break;
            case 0x04: aux1::pub(id(automower_state), "charging"); break;  // drops to 01 once full
            case 0x05: aux1::pub(id(automower_state), "leaving station"); break;
            case 0x07: aux1::pub(id(automower_state), "fault"); break;
            // 30 Sep (boundary wire cut): stops, sleeps, re-checks every ~5.5 min,
            // resumes by itself once the loop signal is back. Not a latched fault.
            case 0x08: aux1::pub(id(automower_state), "waiting for loop signal"); break;
            default: {
              char buf[16];
              snprintf(buf, sizeof(buf), "unknown 0x%02X", p[0]);
              aux1::pub(id(automower_state), buf);
            }
          }
          if (n >= 4) {
            switch (p[3] & 0x30) {
              case 0x00: aux1::pub(id(automower_mode), "AUTO"); break;
              case 0x10: aux1::pub(id(automower_mode), "MAN"); break;
              case 0x20: aux1::pub(id(automower_mode), "HOME"); break;
              default: {
                char buf[16];
                snprintf(buf, sizeof(buf), "unknown 0x%02X", p[3]);
                aux1::pub(id(automower_mode), buf);
              }
            }
          }
          // b3 low bits = timer state.
          if (n >= 4) {
            switch (p[3] & 0x03) {
              case 0x00: aux1::pub(id(automower_timer), "no restriction"); break;
              case 0x01: aux1::pub(id(automower_timer), "in work period"); break;
              case 0x02: aux1::pub(id(automower_timer), "waiting"); break;
              default: aux1::pub(id(automower_timer), "unknown 3"); break;
            }
          }
          if (n >= 4) aux1::pub(id(automower_status_byte3), p[3]);
          if (n >= 5) aux1::pub(id(automower_status_byte4), p[4]);

          // Mow day tracking (see globals). One session per mowing day: it
          // starts at the first mowing frame, charge stops inside the work
          // period only count cycles, and it ends once the mower is docked AND
          // the timer is no longer in a work period (or HOME is selected).
          // With no timer set (b3 low bits 0) it ends at each dock.
          auto now = id(sntp_time).now();
          uint32_t epoch = now.is_valid() ? (uint32_t) now.timestamp : 0;
          uint8_t timer_bits = n >= 4 ? (p[3] & 0x03) : 0;
          bool home_selected = n >= 4 && (p[3] & 0x30) == 0x20;
          if (p[0] == 0x02 && !id(mow_active)) {
            id(mow_active) = true;
            id(mow_docked) = false;
            id(mow_start_epoch) = epoch;
            id(mow_dock_epoch) = 0;
            id(mow_cycles) = 1;
            id(mow_blade_sum) = 0;
            id(mow_blade_n) = 0;
            id(mow_faults) = 0;
            ESP_LOGI("mow", "Mow day started");
          } else if (p[0] == 0x02 && id(mow_docked)) {
            id(mow_docked) = false;
            id(mow_cycles) += 1;
            ESP_LOGI("mow", "Back out after charging - cycle %u", (unsigned) id(mow_cycles));
          }
          // last_state_code 00 = unknown (just after an ESP reboot): an ongoing
          // fault is not counted again (5 Oct: the trampoline fault was counted
          // twice after a flash).
          if (id(mow_active) && p[0] == 0x07 && id(last_state_code) != 0x07 && id(last_state_code) != 0x00) {
            id(mow_faults) += 1;
            ESP_LOGI("mow", "Fault during mow (%u so far)", (unsigned) id(mow_faults));
          }
          if (id(mow_active) && p[0] == 0x04 && !id(mow_docked)) {
            id(mow_docked) = true;
            id(mow_dock_epoch) = epoch;
            ESP_LOGI("mow", "Docked (cycle %u)", (unsigned) id(mow_cycles));
          }
          if (id(mow_active) && id(mow_docked) && (timer_bits != 0x01 || home_selected)) {
            id(mow_active) = false;
            id(mow_docked) = false;
            uint32_t end = id(mow_dock_epoch) ? id(mow_dock_epoch) : epoch;  // time it last docked
            id(last_mow_end_epoch) = epoch;
            id(last_mow_minutes) = (id(mow_start_epoch) && end > id(mow_start_epoch))
                                       ? (end - id(mow_start_epoch)) / 60.0f : NAN;
            id(last_mow_cut_minutes) = id(mow_blade_n) * 10 / 60.0f;  // one blade sample per 10s poll
            id(last_mow_blade_ma) = id(mow_blade_n) ? id(mow_blade_sum) / id(mow_blade_n) : NAN;
            id(last_mow_faults) = id(mow_faults);
            id(last_mow_cycles) = id(mow_cycles);
            ESP_LOGI("mow", "Mow day finished (%u cycle%s)", (unsigned) id(mow_cycles), id(mow_cycles) == 1 ? "" : "s");
            id(publish_last_mow).execute();
          }

          // Next Start (confirmed 2 Oct): read the long 0x12 frame after each
          // wake and whenever the state or b3 (mode/timer) changes.
          if (n >= 4 && (id(next_start_dirty) || p[0] != id(last_state_code) || p[3] != id(last_b3))) {
            id(next_start_dirty) = false;
            id(last_b3) = p[3];
            id(read_next_start).execute();
          }
          // Entering a fault (07) or loop-signal wait (08): read the mower's
          // last event record, which only ever holds the latest event.
          if ((p[0] == 0x07 || p[0] == 0x08) && p[0] != id(last_state_code)) id(read_last_fault).execute();
          id(last_state_code) = p[0];

  # 0x14/01 battery.
  - interval: 60s
    then:
      - lambda: |-
          if (!aux1::ready()) return;
          uint8_t d[2] = {0x01, 0x01};
          uint8_t r[32];
          size_t len = aux1::send_command_authed(id(aux1_uart), 0x14, d, 2, r, sizeof(r),
                                                 id(automower_pin_global), 26);
          if (aux1::status_byte(r, len) != 0x00 || aux1::payload_len(r, len) < 8) return;
          const uint8_t *p = aux1::payload(r);
          // Paired reading: one raw ADC sample taken right now (unfiltered, not
          // the 4-sample average), logged next to the mower's own voltage so the
          // pack_multiplier can be checked across the whole range (so far only
          // 19.8-20.5V). Grep the capture log for "pair:".
          float aux_v = aux1::le16(p + 0) / 1000.0f;
          float adc_v = id(automower_pack_voltage).sample() * ${pack_multiplier};
          ESP_LOGI("pack", "pair: aux1 %.3fV adc %.3fV diff %+.3fV ratio %.4f (mA %d)", aux_v, adc_v, adc_v - aux_v,
                   aux_v > 0 ? adc_v / aux_v : 0.0f, (int) aux1::le16s(p + 4));
          aux1::pub(id(automower_battery_voltage), aux_v, 0.02f);
          aux1::pub(id(automower_battery_capacity), aux1::le16s(p + 2));
          aux1::pub(id(automower_battery_current), aux1::le16s(p + 4), 20);
          aux1::pub(id(automower_battery_temp), aux1::le16s(p + 6) / 10.0f);  // signed for sub-zero

  # 0x14/04 tilt + collision/lift, 0x14/03 blade, 0x14/02 wheels.
  # Full rate (10s) only while moving: mowing, going home, leaving the
  # station, or state not yet known. In the station, stopped or faulted: tilt only, every 60s (enough
  # for the lifted-fault alert), and blade/wheels are skipped (zeroed once on
  # the way in so HA doesn't show stale motion).
  - interval: 10s
    then:
      - lambda: |-
          if (!aux1::ready()) return;
          uint8_t s = id(last_state_code);
          bool active = (s == 0x02 || s == 0x03 || s == 0x05 || s == 0x00);
          if (!active) {
            if (id(motor_poll_active)) {
              id(motor_poll_active) = false;
              id(quiet_tick) = 0;
              aux1::pub(id(automower_blade_rpm), 0);
              aux1::pub(id(automower_blade_current), 0, 20);
              aux1::pub(id(automower_wheel_l_power), 0);
              aux1::pub(id(automower_wheel_r_power), 0);
              aux1::pub(id(automower_wheel_l_speed), 0);
              aux1::pub(id(automower_wheel_r_speed), 0);
              ESP_LOGI("automower", "Mower idle/docked - motor polling off, tilt every 60s");
            }
            if (++id(quiet_tick) < 6) return;
            id(quiet_tick) = 0;
          } else if (!id(motor_poll_active)) {
            id(motor_poll_active) = true;
            ESP_LOGI("automower", "Mower active - full-rate polling");
          }
          uint8_t r[32];
          size_t len;

          uint8_t tilt[1] = {0x04};
          len = aux1::send_command_authed(id(aux1_uart), 0x14, tilt, 1, r, sizeof(r),
                                          id(automower_pin_global), 17);
          if (aux1::status_byte(r, len) == 0x00 && aux1::payload_len(r, len) >= 8) {
            const uint8_t *p = aux1::payload(r);
            aux1::pub(id(automower_tilt_collision_raw), aux1::hex_dump(p, aux1::payload_len(r, len)));
            id(automower_collision).publish_state(p[0] == 0x01);
            id(automower_lifted).publish_state(p[1] == 0x01);
            aux1::pub(id(automower_tilt_x), aux1::le16s(p + 2), 5);
            aux1::pub(id(automower_tilt_y), aux1::le16s(p + 4), 5);
            aux1::pub(id(automower_tilt_z), aux1::le16s(p + 6), 10);
          }
          if (!active) return;

          uint8_t blade[2] = {0x03, 0x01};
          len = aux1::send_command_authed(id(aux1_uart), 0x14, blade, 2, r, sizeof(r),
                                          id(automower_pin_global));
          if (aux1::status_byte(r, len) == 0x00 && aux1::payload_len(r, len) >= 4) {
            const uint8_t *p = aux1::payload(r);
            aux1::pub(id(automower_blade_rpm), aux1::le16(p + 0));
            aux1::pub(id(automower_blade_current), aux1::le16s(p + 2), 20);  // signed: idle reads ~-12mA
            // Session average: only while mowing with the blade actually spinning.
            if (id(mow_active) && id(last_state_code) == 0x02 && aux1::le16(p + 0) > 1000) {
              id(mow_blade_sum) += aux1::le16s(p + 2);
              id(mow_blade_n) += 1;
            }
          }

          uint8_t wheels[2] = {0x02, 0x01};
          len = aux1::send_command_authed(id(aux1_uart), 0x14, wheels, 2, r, sizeof(r),
                                          id(automower_pin_global));
          if (aux1::status_byte(r, len) == 0x00 && aux1::payload_len(r, len) >= 10) {
            const uint8_t *p = aux1::payload(r);
            aux1::pub(id(automower_wheel_r_power), aux1::le16s(p + 0));
            aux1::pub(id(automower_wheel_r_speed), aux1::le16s(p + 2));
            aux1::pub(id(automower_wheel_l_power), aux1::le16s(p + 6));
            aux1::pub(id(automower_wheel_l_speed), aux1::le16s(p + 8));
          }

  # 0x18 statistics.
  - interval: 300s
    then:
      - lambda: |-
          if (!aux1::ready()) return;
          uint8_t r[32];
          size_t len = aux1::send_command_authed(id(aux1_uart), 0x18, nullptr, 0, r, sizeof(r),
                                                 id(automower_pin_global));
          if (aux1::status_byte(r, len) != 0x00 || aux1::payload_len(r, len) < 10) return;
          const uint8_t *p = aux1::payload(r);
          aux1::pub(id(automower_total_hours), aux1::le16(p + 0));
          aux1::pub(id(automower_mow_hours), aux1::le16(p + 2));
          aux1::pub(id(automower_search_hours), aux1::le16(p + 4));
          aux1::pub(id(automower_charge_count), aux1::le16(p + 8));

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
sensor:
  - platform: uptime
    name: "Automower Uptime"
    entity_category: diagnostic

  # Last completed mowing day (published when the day ends, and again at boot).
  # Duration = first start to last dock, including charge stops in between.
  - platform: template
    id: last_mow_duration
    name: "Last Mow Duration"
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: last_mow_cutting
    name: "Last Mow Cutting Time"
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  # Average blade current while cutting - a proxy for how much grass there
  # was. Long-term statistics in HA give the trend across mows.
  - platform: template
    id: last_mow_blade
    name: "Last Mow Blade Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    icon: mdi:grass
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: last_mow_fault_count
    name: "Last Mow Faults"
    state_class: measurement
    icon: mdi:alert-circle-outline
    accuracy_decimals: 0
    update_interval: never

  # To check whether resets (task watchdog 28 Sep, mid-mow) line up with a
  # weak link out on the lawn.
  - platform: wifi_signal
    name: "Automower WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # Battery (0x14/01)
  - platform: template
    id: automower_battery_voltage
    name: "Automower Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: automower_battery_current
    name: "Automower Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: automower_battery_temp
    name: "Automower Battery Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  # The mower's own estimate. It does NOT see the ESP32's drain (5 Oct: read
  # 1208mAh / 100% with the pack at 18.1V after a weekend in standby).
  - platform: template
    id: automower_battery_capacity
    name: "Automower Battery Capacity"
    unit_of_measurement: "mAh"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Statistics (0x18). Mow/search hours not yet checked against the display.
  - platform: template
    id: automower_total_hours
    name: "Automower Total Hours"
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: automower_mow_hours
    name: "Automower Mow Hours"
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_search_hours
    name: "Automower Search Hours"
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_charge_count
    name: "Automower Charge Count"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never

  # Status (0x12) undecoded bytes, for correlating against events.
  - platform: template
    id: automower_status_byte3
    name: "Automower Status Byte3"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_status_byte4
    name: "Automower Status Byte4"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  # Tilt (0x14/04), 0.1 deg per count, right roll positive.
  - platform: template
    id: automower_tilt_x
    name: "Automower Tilt X"
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    filters:
      - multiply: 0.1
  - platform: template
    id: automower_tilt_y
    name: "Automower Tilt Y"
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    filters:
      - multiply: 0.1
  - platform: template
    id: automower_tilt_z
    name: "Automower Tilt Z"   # raw; Z-axis or magnitude - unconfirmed
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  # Blade (0x14/03). Free-spin ~52-60mA; real cutting expected ~1A.
  - platform: template
    id: automower_blade_rpm
    name: "Automower Blade RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: automower_blade_current
    name: "Automower Blade Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  # Wheels (0x14/02). Power in %, speed in mm/s.
  - platform: template
    id: automower_wheel_l_power
    name: "Automower Wheel Left Power"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_wheel_r_power
    name: "Automower Wheel Right Power"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_wheel_l_speed
    name: "Automower Wheel Left Speed"
    unit_of_measurement: "mm/s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_wheel_r_speed
    name: "Automower Wheel Right Speed"
    unit_of_measurement: "mm/s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  # Pack voltage straight off the battery (independent of AUX1). Averaged
  # over 4 readings so one noisy sample can't trigger deep sleep.
  # Below ${battery_low_voltage}V AND mower off/standby (AUX1 unpowered):
  # release all relays, then deep sleep for ${battery_deep_sleep_duration}
  # and re-check on wake. Never sleeps while the mower is awake - it manages
  # its own battery, and voltage sags under mowing load.
  - platform: adc
    pin: GPIO34
    id: automower_pack_voltage
    name: "Automower Pack Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - multiply: ${pack_multiplier}
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: "return x < ${battery_low_voltage} && !id(automower_aux1_awake).state;"
            then:
              - logger.log:
                  format: "Pack %.2fV < ${battery_low_voltage}V with mower asleep - releasing relays, deep sleep ${battery_deep_sleep_duration}"
                  args: ["x"]
                  tag: automower
              - script.stop: key_sequence
              - script.execute: release_keys
              - switch.turn_off: automower_stop_loop
              - lambda: "id(automower_hatch).publish_state(false);"
              - deep_sleep.enter:
                  id: automower_deep_sleep
                  sleep_duration: ${battery_deep_sleep_duration}

text_sensor:
  # One-line summary of the last completed mow, for notifications.
  - platform: template
    id: last_mow_summary
    name: "Last Mow Summary"
    icon: mdi:robot-mower
    update_interval: never

  - platform: debug
    reset_reason:
      name: "Automower Reset Reason"
      entity_category: diagnostic

  # idle / mowing (auto|man) / going home / charging / leaving station /
  # fault / waiting for loop signal / unknown 0xNN (from 0x12), or standby
  # when AUX1 power drops.
  # idle = parked on the base fully charged OR stopped on the lawn.
  - platform: template
    id: automower_state
    name: "Automower State"
    update_interval: never
  # Selected operation mode HOME / AUTO / MAN (0x12 b3 & 0x30). Stays HOME
  # after docking until AUTO or MAN is chosen.
  - platform: template
    id: automower_mode
    name: "Automower Mode"
    icon: mdi:home-switch
    update_interval: never
  # Timer state (0x12 b3 & 0x03): no restriction / in work period / waiting
  # (outside the work hours or days).
  - platform: template
    id: automower_timer
    name: "Automower Timer"
    icon: mdi:timer-outline
    update_interval: never
  # Next scheduled start from the mower's own timer (long 0x12 frame), e.g.
  # "Mon 05 Oct 11:00"; "now (in work period)" while inside a work period.
  - platform: template
    id: automower_next_start
    name: "Automower Next Start"
    icon: mdi:calendar-clock
    update_interval: never
  # Timer control state: normal timer / parked ... / restoring ... / FAILED.
  - platform: template
    id: automower_timer_control
    name: "Automower Timer Control"
    icon: mdi:calendar-lock
    update_interval: never
  # Skip Today: off / skipping - back to AUTO at 23:00 / back to AUTO ...
  # (next start) / FAILED ...
  - platform: template
    id: automower_skip
    name: "Automower Skip"
    icon: mdi:calendar-remove
    update_interval: never
  # Result of the last keypad self test (PASS/FAIL + per-step detail).
  - platform: template
    id: automower_self_test
    name: "Automower Self Test"
    icon: mdi:clipboard-check-outline
    update_interval: never
  # Result of the last top-up wake, e.g.
  # "Tue 02:00: pack 19.1V, charging 1015mA, clock +3s ok".
  - platform: template
    id: automower_topup
    name: "Automower Top-up"
    icon: mdi:battery-charging-medium
    update_interval: never
  # Last fault/event the mower recorded (0x18 [05 01]), read automatically
  # when the state goes to fault (07) or waiting for loop signal (08), e.g.
  # "Mon 05 Oct 14:43 - code 15 Mower lifted". Code = Husqvarna fault number.
  - platform: template
    id: automower_last_fault
    name: "Automower Last Fault"
    icon: mdi:alert-octagon-outline
    update_interval: never
  - platform: template
    id: automower_status_raw
    name: "Automower Status Raw"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_tilt_collision_raw
    name: "Automower Tilt Collision Raw"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: automower_raw_response
    name: "Automower Raw Response"
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: gpio
    id: automower_aux1_awake
    name: "Automower AUX1 Awake"
    pin:
      number: GPIO4
      mode: INPUT
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    id: automower_fault_active
    name: "Automower Fault Active"
    device_class: problem
  - platform: template
    id: automower_charging
    name: "Automower Charging"
    device_class: battery_charging
  - platform: template
    id: automower_collision
    name: "Automower Collision"
    device_class: problem
  - platform: template
    id: automower_lifted
    name: "Automower Lifted"
    device_class: problem

# ---------------------------------------------------------------------------
# Switches
# ---------------------------------------------------------------------------
switch:
  # AUX1 traffic enable. Turned off automatically when a key sequence opens
  # the Tools/EXP menu ('x' / 'e'). Turn back on after leaving that menu
  # (7+9 again, or power cycle).
  - platform: template
    id: aux1_polling
    name: "AUX1 Polling"
    optimistic: true
    restore_mode: ALWAYS_ON
    entity_category: config

  # Timer control: restore the normal timer automatically at
  # ${timer_restore_hour}:${timer_restore_minute} after a Park. Off = parked until Restore Timer.
  - platform: template
    id: timer_auto_restore
    name: "Timer Auto Restore"
    icon: mdi:calendar-refresh
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  # Nightly top-up at ${topup_hour}:${topup_minute}. Off by default until
  # the manual test (Automower Top-up Now) has shown it charges.
  - platform: template
    id: nightly_topup_enabled
    name: "Nightly Top-up"
    icon: mdi:battery-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  # Relays - internal only; HA sees the momentary buttons below.
  # Active-low boards, so inverted: true ("off" = de-energised).
  # Board 1 relays 1-8 = PA0-PA7, board 2 relays 1-8 = PB7-PB0.
  # ESPHome numbering: 0-7 = PA0-PA7, 8-15 = PB0-PB7.
  - {platform: gpio, id: keypad_back,    internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 0,  mode: {output: true}, inverted: true}}  # PA0 B1R1 2+6 left soft key
  - {platform: gpio, id: keypad_digit_1, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 1,  mode: {output: true}, inverted: true}}  # PA1 B1R2 2+7
  - {platform: gpio, id: keypad_digit_4, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 2,  mode: {output: true}, inverted: true}}  # PA2 B1R3 2+8
  - {platform: gpio, id: keypad_digit_7, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 3,  mode: {output: true}, inverted: true}}  # PA3 B1R4 2+9
  - {platform: gpio, id: keypad_digit_9, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 4,  mode: {output: true}, inverted: true}}  # PA4 B1R5 4+9
  - {platform: gpio, id: keypad_digit_6, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 5,  mode: {output: true}, inverted: true}}  # PA5 B1R6 4+8
  - {platform: gpio, id: keypad_digit_3, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 6,  mode: {output: true}, inverted: true}}  # PA6 B1R7 4+7
  - {platform: gpio, id: keypad_next,    internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 7,  mode: {output: true}, inverted: true}}  # PA7 B1R8 4+6 right soft key / MENU
  - {platform: gpio, id: keypad_digit_0, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 15, mode: {output: true}, inverted: true}}  # PB7 B2R1 3+10
  - {platform: gpio, id: keypad_digit_8, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 14, mode: {output: true}, inverted: true}}  # PB6 B2R2 3+9
  - {platform: gpio, id: keypad_digit_5, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 13, mode: {output: true}, inverted: true}}  # PB5 B2R3 3+8
  - {platform: gpio, id: keypad_digit_2, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 12, mode: {output: true}, inverted: true}}  # PB4 B2R4 3+7
  - {platform: gpio, id: keypad_ok,      internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 11, mode: {output: true}, inverted: true}}  # PB3 B2R5 3+6 middle soft key
  - {platform: gpio, id: keypad_start,   internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 10, mode: {output: true}, inverted: true}}  # PB2 B2R6 1+6
  - {platform: gpio, id: keypad_home,    internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 9,  mode: {output: true}, inverted: true}}  # PB1 B2R7 5+6
  # Stop loop: B2R8 NC contact. Off = loop closed = hatch closed (also
  # fail-safe when the ESP32 is off or asleep). Only driven by the
  # Automower Hatch switch below. Never drive it directly.
  - {platform: gpio, id: automower_stop_loop, internal: true, restore_mode: ALWAYS_OFF, pin: {mcp23xxx: relay_mcp, number: 8, mode: {output: true}, inverted: true}}  # PB0 B2R8 NC

  # Hatch emulation - the one deliberate exception to "no latched relays".
  # ON = stop loop held open = mower sees the hatch open (and STOP pressed).
  # OFF = hatch closed. Closing COMMITS whatever is on screen (e.g. HOME).
  # Open then close also wakes the mower from standby (was the stop pulse).
  # Boots closed. An ESP32 reset while open also closes it (relay drops to
  # NC) - which commits too. No auto-close: left open, the mower stays stopped.
  # NB (5 Oct): docked with HOME selected, the mower drops to standby ~16s
  # after the hatch closes; in AUTO it stayed awake ~25 min (2 Oct).
  - platform: template
    id: automower_hatch
    name: "Automower Hatch"
    icon: mdi:door-open
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - switch.turn_on: automower_stop_loop
      - logger.log: {format: "Hatch OPEN", tag: automower}
    turn_off_action:
      - switch.turn_off: automower_stop_loop
      - logger.log: {format: "Hatch CLOSED", tag: automower}

# ---------------------------------------------------------------------------
# Buttons
# ---------------------------------------------------------------------------
button:
  # Single keys. All go through key_sequence, so a key pressed while a
  # sequence is playing is rejected (logged), never interleaved.
  - {platform: template, name: "Keypad Digit 0", on_press: [{script.execute: {id: key_sequence, seq: "0"}}]}
  - {platform: template, name: "Keypad Digit 1", on_press: [{script.execute: {id: key_sequence, seq: "1"}}]}
  - {platform: template, name: "Keypad Digit 2", on_press: [{script.execute: {id: key_sequence, seq: "2"}}]}
  - {platform: template, name: "Keypad Digit 3", on_press: [{script.execute: {id: key_sequence, seq: "3"}}]}
  - {platform: template, name: "Keypad Digit 4", on_press: [{script.execute: {id: key_sequence, seq: "4"}}]}
  - {platform: template, name: "Keypad Digit 5", on_press: [{script.execute: {id: key_sequence, seq: "5"}}]}
  - {platform: template, name: "Keypad Digit 6", on_press: [{script.execute: {id: key_sequence, seq: "6"}}]}
  - {platform: template, name: "Keypad Digit 7", on_press: [{script.execute: {id: key_sequence, seq: "7"}}]}
  - {platform: template, name: "Keypad Digit 8", on_press: [{script.execute: {id: key_sequence, seq: "8"}}]}
  - {platform: template, name: "Keypad Digit 9", on_press: [{script.execute: {id: key_sequence, seq: "9"}}]}
  - {platform: template, name: "Keypad Start",   on_press: [{script.execute: {id: key_sequence, seq: "s"}}]}
  - {platform: template, name: "Keypad Home",    on_press: [{script.execute: {id: key_sequence, seq: "h"}}]}  # tap = cycle HOME/AUTO/MAN
  - {platform: template, name: "Keypad Next",    on_press: [{script.execute: {id: key_sequence, seq: "m"}}]}
  - {platform: template, name: "Keypad Back",    on_press: [{script.execute: {id: key_sequence, seq: "b"}}]}
  - {platform: template, name: "Keypad OK",      on_press: [{script.execute: {id: key_sequence, seq: "o"}}]}
  - {platform: template, name: "Keypad Return",  on_press: [{script.execute: {id: key_sequence, seq: "r"}}]}  # hold Home -> idle screen
  - {platform: template, name: "Keypad Expert Mode", on_press: [{script.execute: {id: key_sequence, seq: "e"}}]}  # Tools/EXP; pauses AUX1 polling

  # Operation mode the way a person does it: open hatch, Home hold (screen on,
  # home screen - added 2 Oct), Menu, House, digit (1 HOME, 2 AUTO, 3 MAN),
  # Start, close hatch. [mhNs] confirmed 28 Sep.
  # Mode Home is sticky: the mower stays home until Auto or Man is chosen.
  # Any of the three cancels a pending Skip Today (see mode_button).
  - {platform: template, name: "Automower Mode Home", icon: "mdi:home-import-outline", on_press: [{script.execute: {id: mode_button, seq: "[rmh1s]"}}]}
  - {platform: template, name: "Automower Mode Auto", icon: "mdi:robot-mower",         on_press: [{script.execute: {id: mode_button, seq: "[rmh2s]"}}]}
  - {platform: template, name: "Automower Mode Man",  icon: "mdi:hand-back-right",     on_press: [{script.execute: {id: mode_button, seq: "[rmh3s]"}}]}

  # Skip Today: HOME now (goes home if out, stays docked if not), then back to
  # AUTO at ${skip_rearm_hour}:${skip_rearm_minute}, outside the work hours, so it waits for the next
  # start. Pressed after ${skip_rearm_hour}:${skip_rearm_minute}, AUTO comes back the following night
  # (i.e. tomorrow is skipped too).
  - platform: template
    name: "Automower Skip Today"
    icon: mdi:calendar-remove
    on_press:
      - if:
          condition:
            lambda: "return id(key_sequence).is_running() || id(skip_today).is_running() || id(skip_rearm).is_running() || id(timer_apply).is_running() || id(self_test).is_running() || id(nightly_topup).is_running();"
          then:
            - logger.log: {format: "Skip Today: busy - ignored", level: WARN, tag: skip}
          else:
            - script.execute: skip_today

  # Plays the Keypad Menu Path text. A leading digit gets Menu prepended
  # (so "3231" = Menu,3,2,3,1). Then it is auto-wrapped as [r ... r s] unless
  # it already starts with '[' (played as typed) or '!' (rest sent raw, no
  # wrap - for single keys / diagnostics). See keypad_and_menus.md.
  - platform: template
    name: "Send Keypad Menu Path"
    on_press:
      - script.execute:
          id: key_sequence
          seq: !lambda |-
            std::string s = id(keypad_menu_path).state;
            if (!s.empty() && isdigit((unsigned char) s[0])) s = "m" + s;
            return aux1::wrap_sequence(s);

  # Timer control (keypad_and_menus.md -> "Timer control").
  # Park: all work days off, so the mower goes home / stays home in AUTO.
  # Restore: writes timer_normal back (also automatic at ${timer_restore_hour}:${timer_restore_minute}
  # if "Timer Auto Restore" is on).
  - platform: template
    name: "Automower Park (timer off)"
    icon: mdi:home-clock
    on_press:
      - if:
          condition:
            lambda: "return id(timer_apply).is_running() || id(self_test).is_running() || id(nightly_topup).is_running();"
          then:
            - logger.log: {format: "Timer control busy - Park ignored", level: WARN, tag: timer}
          else:
            - script.execute: {id: timer_apply, park: true}
  - platform: template
    name: "Automower Restore Timer"
    icon: mdi:calendar-sync
    on_press:
      - if:
          condition:
            lambda: "return id(timer_apply).is_running() || id(self_test).is_running() || id(nightly_topup).is_running();"
          then:
            - logger.log: {format: "Timer control busy - Restore ignored", level: WARN, tag: timer}
          else:
            - lambda: |-
                id(timer_parked) = true;   // so a failed restore is retried
                id(restore_due) = true;
                id(restore_attempts) = 0;
            - script.execute: {id: timer_apply, park: false}
  - platform: template
    name: "Automower Keypad Self Test"
    icon: mdi:clipboard-check-outline
    on_press:
      - if:
          condition:
            lambda: "return id(timer_apply).is_running() || id(self_test).is_running() || id(nightly_topup).is_running();"
          then:
            - logger.log: {format: "Self test: busy - ignored", level: WARN, tag: selftest}
          else:
            - script.execute: self_test

  # Top-up now: the same as the nightly run, but without the pack-full skip.
  # Use it docked, with the mower in standby (for the first test: after 15:30).
  - platform: template
    name: "Automower Top-up Now"
    icon: mdi:battery-charging-medium
    on_press:
      - if:
          condition:
            lambda: "return id(nightly_topup).is_running() || id(timer_apply).is_running() || id(self_test).is_running();"
          then:
            - logger.log: {format: "Top-up: busy - ignored", level: WARN, tag: topup}
          else:
            - script.execute: {id: nightly_topup, manual: true}

  # AUX1 mode commands (0x0E). Stop/Home work from AUX1 alone.
  - platform: template
    name: "Automower AUX1 Stop"
    on_press:
      - lambda: "aux1::set_mode(id(aux1_uart), 0x00, id(automower_pin_global));"
  - platform: template
    name: "Automower AUX1 Home"
    on_press:
      - lambda: "aux1::set_mode(id(aux1_uart), 0x02, id(automower_pin_global));"
  # Writes the SNTP time and date to the mower. Wakes it first if needed
  # (5 Oct: two presses failed silently with status FF while it was asleep).
  - platform: template
    name: "Automower Sync Time"
    on_press:
      - if:
          condition:
            lambda: "return id(key_sequence).is_running() || id(nightly_topup).is_running();"
          then:
            - logger.log: {format: "Sync Time: busy - ignored", level: WARN, tag: automower}
          else:
            - script.execute: wake_mower
            - script.wait: wake_mower
            - script.execute: sync_mower_time

  - platform: template
    name: "Send Raw Query"
    entity_category: diagnostic
    on_press:
      - script.execute: send_raw_query

# Text inputs are storage only - nothing is sent until the matching Send
# button is pressed (sending on on_value re-fired on every dashboard redraw).
text:
  # Key sequence language (also used by MQTT automower/keys):
  #   0-9 digit   m Menu/Next   o OK   b Back   s Start   h Home tap
  #   r  hold Home ${key_hold_ms}ms (return to idle screen)
  #   x  hold 7+9 ${key_hold_ms}ms (Tools/EXP menu; pauses AUX1 polling)
  #   e  = "rmx" (idle, Menu, 7+9)
  #   [  open hatch (holds the stop loop open)   ]  close hatch (commits)
  #   w  wait one gap with no key     spaces ignored
  # Screen types: selection screens exit with r; value-entry screens need o
  # (or b to discard); Work days checkboxes exit with b.
  # Send Keypad Menu Path / automower/keys auto-wrap the text as [r ... r s]
  # (lid open, Home hold, ..., Home hold, Start, lid closed) - see
  # keypad_and_menus.md. Text starting with '[' is played as typed; '!' = raw.
  # e.g. "1108101030o" = Work hours 1 08:10-10:30 (sent as [rm1108101030ors]);
  # "[rmh1s]" / "[rmh2s]" / "[rmh3s]" = HOME / AUTO / MAN.
  - platform: template
    id: keypad_menu_path
    name: "Keypad Menu Path"
    mode: text
    optimistic: true

  # Raw AUX1 query: hex bytes, first = CMD, rest = DATA. e.g. "12", "14 01 01".
  - platform: template
    id: automower_raw_query
    name: "Automower Raw Query"
    mode: text
    optimistic: true
    entity_category: diagnostic

# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  # Publishes the last completed mow from the stored globals. Runs when a
  # mow finishes and at boot. Does nothing until the first mow completes.
  - id: publish_last_mow
    mode: queued
    then:
      - lambda: |-
          if (id(last_mow_end_epoch) == 0) return;
          float mins = id(last_mow_minutes);
          float cut = id(last_mow_cut_minutes);
          float blade = id(last_mow_blade_ma);
          uint32_t faults = id(last_mow_faults);
          uint32_t cycles = id(last_mow_cycles);
          id(last_mow_duration).publish_state(mins);
          id(last_mow_cutting).publish_state(cut);
          id(last_mow_blade).publish_state(blade);
          id(last_mow_fault_count).publish_state(faults);

          std::string end = ESPTime::from_epoch_local(id(last_mow_end_epoch)).strftime("%a %H:%M");
          char dur[16], cutb[16], bl[16];
          if (std::isnan(mins)) snprintf(dur, sizeof(dur), "?");
          else snprintf(dur, sizeof(dur), "%dh%02dm", (int) mins / 60, (int) mins % 60);
          snprintf(cutb, sizeof(cutb), "%dh%02dm", (int) cut / 60, (int) cut % 60);
          if (std::isnan(blade)) snprintf(bl, sizeof(bl), "?");
          else snprintf(bl, sizeof(bl), "%.0f mA", blade);
          char buf[192];
          snprintf(buf, sizeof(buf), "Mowing done %s: %u cycle%s, %s cutting over %s, blade avg %s, %u fault%s",
                   end.c_str(), (unsigned) cycles, cycles == 1 ? "" : "s", cutb, dur, bl, (unsigned) faults,
                   faults == 1 ? "" : "s");
          id(last_mow_summary).publish_state(buf);

  # Reads the long 0x12 frame and publishes Automower Next Start.
  - id: read_next_start
    mode: queued
    then:
      - lambda: |-
          auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
          if (!l.ok) { id(next_start_dirty) = true; return; }  // try again next poll
          if (l.next_set) aux1::pub(id(automower_next_start), aux1::fmt_mower_time(l.next));
          else aux1::pub(id(automower_next_start), aux1::timer_bits(l) == 1 ? "now (in work period)" : "none");

  # Wakes the mower if it is in standby: hatch open until AUX1 powers up,
  # then closed (from standby the screen is on the home screen, so the close
  # commits nothing), then waits out the 20s traffic hold-off.
  - id: wake_mower
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(automower_aux1_awake).state;"
          then:
            - logger.log: {format: "Waking the mower (hatch open/close)", tag: automower}
            - switch.turn_on: automower_hatch
            - wait_until:
                condition:
                  binary_sensor.is_on: automower_aux1_awake
                timeout: 10s
            - delay: 2s
            - switch.turn_off: automower_hatch
      - wait_until:
          condition:
            lambda: "return aux1::ready();"
          timeout: 40s

  # Writes the SNTP local time and date to the mower (0x02 writes). The
  # caller wakes the mower first. FORMAT 0x04 = 24h, day.month.year.
  - id: sync_mower_time
    mode: single
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("automower", "Sync Time: SNTP time not valid yet - not synced");
            return;
          }
          if (!aux1::ready()) {
            ESP_LOGW("automower", "Sync Time: mower not awake/ready - not synced");
            return;
          }
          uint8_t r[32];
          uint8_t td[4] = {0x80, (uint8_t) t.hour, (uint8_t) t.minute, (uint8_t) t.second};
          size_t len = aux1::send_command_authed(id(aux1_uart), 0x02, td, 4, r, sizeof(r), id(automower_pin_global));
          ESP_LOGI("automower", "Time set %02d:%02d:%02d -> status 0x%02X", t.hour, t.minute, t.second,
                   aux1::status_byte(r, len));
          uint8_t dd[9] = {0x81, (uint8_t) (t.year & 0xFF), (uint8_t) (t.year >> 8), (uint8_t) t.month,
                           (uint8_t) t.day_of_month, 0x04, 0x00, 0x00, 0x00};
          len = aux1::send_command_authed(id(aux1_uart), 0x02, dd, 9, r, sizeof(r), id(automower_pin_global));
          ESP_LOGI("automower", "Date set %04d-%02d-%02d -> status 0x%02X", t.year, t.month, t.day_of_month,
                   aux1::status_byte(r, len));

  # Nightly top-up. The mower does not charge in standby, and the ESP32
  # drains the pack (~0.6Ah overnight, nearly flat after a weekend - 5 Oct).
  # Waking it on the charger makes it charge until it drops back to standby
  # (~25 min in AUTO, only ~16s with HOME selected). While awake, the mower
  # clock is checked against SNTP and synced if it is more than
  # ${clock_sync_threshold_s}s out (drift, BST change).
  # Runs only docked (last state 01/04) with the mower in standby.
  - id: nightly_topup
    mode: single
    parameters:
      manual: bool
    then:
      - lambda: |-
          id(tu_manual) = manual;
          id(tu_sync) = false;
          id(tu_skip) = "";
          uint8_t s = id(last_state_code);
          float pack = id(automower_pack_voltage).state;
          if (id(key_sequence).is_running() || id(timer_apply).is_running() || id(self_test).is_running())
            id(tu_skip) = "busy";
          else if (id(automower_aux1_awake).state)
            id(tu_skip) = "mower already awake";
          else if (s != 0x01 && s != 0x04 && !(manual && s == 0x00))
            id(tu_skip) = "not docked";
          else if (!manual && !std::isnan(pack) && pack > ${topup_skip_above})
            id(tu_skip) = "pack already full";
          if (!id(tu_skip).empty()) {
            auto t = id(sntp_time).now();
            char b[96];
            snprintf(b, sizeof(b), "%s: skipped (%s), pack %.2fV",
                     t.is_valid() ? t.strftime("%a %H:%M").c_str() : "?", id(tu_skip).c_str(), pack);
            ESP_LOGI("topup", "%s", b);
            aux1::pub(id(automower_topup), b);
          } else {
            ESP_LOGI("topup", "Top-up: waking the mower (pack %.2fV, %s)", pack, manual ? "manual" : "scheduled");
            aux1::pub(id(automower_topup), "waking...");
          }
      - if:
          condition:
            lambda: "return id(tu_skip).empty();"
          then:
            - script.execute: wake_mower
            - script.wait: wake_mower
            - delay: 15s   # let charging start before measuring
            - lambda: |-
                auto t = id(sntp_time).now();
                std::string when = t.is_valid() ? t.strftime("%a %H:%M") : std::string("?");
                float pack = id(automower_pack_voltage).state;
                if (!aux1::ready()) {
                  char b[96];
                  snprintf(b, sizeof(b), "%s: FAILED - mower did not wake, pack %.2fV", when.c_str(), pack);
                  ESP_LOGW("topup", "%s", b);
                  aux1::pub(id(automower_topup), b);
                  return;
                }
                // Battery: mower-side voltage and current (positive = charging).
                uint8_t d[2] = {0x01, 0x01};
                uint8_t r[32];
                size_t len = aux1::send_command_authed(id(aux1_uart), 0x14, d, 2, r, sizeof(r),
                                                       id(automower_pin_global), 26);
                float mv = NAN;
                int ma = 0;
                bool batt_ok = aux1::status_byte(r, len) == 0x00 && aux1::payload_len(r, len) >= 6;
                if (batt_ok) {
                  const uint8_t *p = aux1::payload(r);
                  mv = aux1::le16(p + 0) / 1000.0f;
                  ma = aux1::le16s(p + 4);
                }
                // Clock: mower local time (epoch) vs SNTP local time.
                auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
                char clk[40] = "clock ?";
                if (l.ok && t.is_valid()) {
                  time_t ts = (time_t) t.timestamp;
                  struct tm g;
                  gmtime_r(&ts, &g);
                  int off = (t.hour * 60 + t.minute) - (g.tm_hour * 60 + g.tm_min);  // local - UTC, minutes
                  if (off > 720) off -= 1440;
                  if (off < -720) off += 1440;
                  int32_t local = (int32_t) t.timestamp + off * 60;
                  int32_t drift = (int32_t) l.clock - local;
                  bool sync = drift > ${clock_sync_threshold_s} || drift < -${clock_sync_threshold_s};
                  id(tu_sync) = sync;
                  snprintf(clk, sizeof(clk), "clock %+lds %s", (long) drift, sync ? "-> syncing" : "ok");
                }
                char b[160];
                if (batt_ok)
                  snprintf(b, sizeof(b), "%s: pack %.2fV, mower %.2fV, %s %dmA, %s", when.c_str(), pack, mv,
                           ma > 50 ? "charging" : "NOT charging", ma, clk);
                else
                  snprintf(b, sizeof(b), "%s: pack %.2fV, battery read failed, %s", when.c_str(), pack, clk);
                ESP_LOGI("topup", "%s", b);
                aux1::pub(id(automower_topup), b);
            - if:
                condition:
                  lambda: "return id(tu_sync);"
                then:
                  - script.execute: sync_mower_time

  # Timer control: plays timer_park or timer_normal (wrapped), then checks the
  # result from the long 0x12 frame while the mower is still awake (it can
  # drop to standby ~15s after the lid closes). If the first read doesn't
  # confirm it, it re-reads once 6s later (5 Oct: one restore read "no
  # restriction" for an unknown reason).
  #   Park OK    = timer state "waiting".
  #   Restore OK = timer active ("in work period", or "waiting" with a next start).
  # A failed restore stays due and is retried by the 10-min interval.
  - id: timer_apply
    mode: single
    parameters:
      park: bool
    then:
      - lambda: |-
          id(tc_park) = park;
          if (park) {
            id(timer_parked) = true;
            id(restore_due) = false;
            id(tc_seq) = aux1::wrap_sequence("${timer_park}");
            ESP_LOGI("timer", "Timer control: PARK - all work days off");
            aux1::pub(id(automower_timer_control), "parking...");
          } else {
            id(restore_attempts) += 1;
            id(tc_seq) = aux1::wrap_sequence("${timer_normal}");
            ESP_LOGI("timer", "Timer control: RESTORE normal timer (attempt %d)", id(restore_attempts));
            char b[48];
            snprintf(b, sizeof(b), "restoring (attempt %d)...", id(restore_attempts));
            aux1::pub(id(automower_timer_control), b);
          }
      - wait_until:
          condition:
            lambda: "return !id(key_sequence).is_running();"
          timeout: 120s
      - script.execute:
          id: key_sequence
          seq: !lambda "return id(tc_seq);"
      - script.wait: key_sequence
      - lambda: |-
          id(tc_try) = 0;
          id(tc_done) = false;
      - while:
          condition:
            lambda: "return !id(tc_done);"
          then:
            - delay: !lambda "return id(tc_try) == 0 ? 2000 : 6000;"
            - lambda: |-
                bool last = id(tc_try) >= 1;
                id(tc_try) += 1;
                auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
                if (l.ok) {
                  if (l.next_set) aux1::pub(id(automower_next_start), aux1::fmt_mower_time(l.next));
                  else aux1::pub(id(automower_next_start), aux1::timer_bits(l) == 1 ? "now (in work period)" : "none");
                }
                uint8_t tb = l.ok ? aux1::timer_bits(l) : 0xFF;
                // With HOME selected the timer never shows "waiting" (bits read 0
                // outside a work period) and Next Start is only shown for a few
                // seconds after the lid closes (9 Oct), so a restore counts as
                // confirmed once a next start is shown.
                bool home = l.ok && aux1::mode_bits(l) == 0x20;
                bool ok = park ? (l.ok && tb == 0x02)
                               : (l.ok && (tb == 0x01 || l.next_set));
                if (!ok && !last) {
                  ESP_LOGI("timer", "Timer control: %s not confirmed on first read (timer bits 0x%02X) - re-reading",
                           park ? "park" : "restore", tb);
                  return;
                }
                id(tc_done) = true;
                if (park) {
                  char b[96];
                  if (ok) {
                    snprintf(b, sizeof(b), "parked - %s", id(timer_auto_restore).state ? "auto restore ${timer_restore_hour}:${timer_restore_minute}" : "restore manually");
                    ESP_LOGI("timer", "Timer control: parked OK (timer waiting)");
                  } else if (home) {
                    snprintf(b, sizeof(b), "park sent - HOME selected, can't be verified");
                    ESP_LOGI("timer", "Timer control: park sent; HOME selected, so the timer state can't be read");
                  } else {
                    snprintf(b, sizeof(b), "park NOT confirmed (timer bits %02X) - check mower", tb);
                    ESP_LOGW("timer", "Timer control: park not confirmed (timer bits 0x%02X)", tb);
                  }
                  aux1::pub(id(automower_timer_control), b);
                } else if (ok) {
                  id(timer_parked) = false;
                  id(restore_due) = false;
                  id(restore_attempts) = 0;
                  std::string ns = l.next_set ? aux1::fmt_mower_time(l.next) : std::string("now");
                  ESP_LOGI("timer", "Timer control: normal timer restored, next start %s%s", ns.c_str(),
                           home ? " (HOME selected - won't start until AUTO)" : "");
                  aux1::pub(id(automower_timer_control), "normal timer (next start " + ns + ")" +
                                                             (home ? std::string(" - HOME selected") : std::string("")));
                } else {
                  ESP_LOGW("timer", "Timer control: restore not confirmed (read %s, timer bits 0x%02X) - retry in 10 min",
                           l.ok ? "ok" : "failed", tb);
                  char b[64];
                  snprintf(b, sizeof(b), "restore attempt %d not confirmed - retrying", id(restore_attempts));
                  aux1::pub(id(automower_timer_control), b);
                }

  # Mode Home / Auto / Man buttons. A deliberate mode choice cancels a pending
  # Skip Today, so 23:00 never undoes it. Ignored (and the skip kept) if a
  # sequence is already playing, since key_sequence would reject it anyway.
  - id: mode_button
    mode: single
    parameters:
      seq: string
    then:
      - if:
          condition:
            lambda: "return id(key_sequence).is_running() || id(skip_today).is_running() || id(skip_rearm).is_running();"
          then:
            - logger.log: {format: "Mode button: busy - ignored", level: WARN, tag: keypad}
          else:
            - lambda: |-
                if (id(skip_pending)) {
                  id(skip_pending) = false;
                  id(skip_due) = false;
                  ESP_LOGI("skip", "Skip Today cancelled by a mode button");
                }
                aux1::pub(id(automower_skip), "off");
            - script.execute:
                id: key_sequence
                seq: !lambda "return seq;"

  # Skip Today, part 1: HOME now and remember to switch back. Checked from the
  # long 0x12 frame 2s after the lid closes (HOME = mode bits 0x20).
  - id: skip_today
    mode: single
    then:
      - lambda: |-
          id(skip_pending) = true;
          id(skip_due) = false;
          id(skip_attempts) = 0;
          auto t = id(sntp_time).now();
          bool late = t.is_valid() && t.hour * 60 + t.minute >= atoi("${skip_rearm_hour}") * 60 + atoi("${skip_rearm_minute}");
          ESP_LOGI("skip", "Skip Today: HOME now, back to AUTO %s at ${skip_rearm_hour}:${skip_rearm_minute}", late ? "tomorrow" : "tonight");
          aux1::pub(id(automower_skip), "setting HOME...");
      - script.execute: {id: key_sequence, seq: "[rmh1s]"}
      - script.wait: key_sequence
      - delay: 2s
      - lambda: |-
          auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
          auto t = id(sntp_time).now();
          bool late = t.is_valid() && t.hour * 60 + t.minute >= atoi("${skip_rearm_hour}") * 60 + atoi("${skip_rearm_minute}");
          std::string when = std::string(late ? "tomorrow " : "") + "${skip_rearm_hour}:${skip_rearm_minute}";
          if (l.ok && aux1::mode_bits(l) == 0x20) {
            ESP_LOGI("skip", "Skip Today: HOME confirmed (status %s)", aux1::hex_dump(l.st, 6).c_str());
            aux1::pub(id(automower_skip), "skipping - back to AUTO " + when);
          } else {
            // Kept pending either way: switching back to AUTO later is harmless.
            ESP_LOGW("skip", "Skip Today: HOME NOT confirmed (%s) - check the mower",
                     l.ok ? aux1::hex_dump(l.st, 6).c_str() : "no reply");
            aux1::pub(id(automower_skip), "HOME NOT confirmed - check mower (AUTO " + when + ")");
          }

  # Skip Today, part 2 (at ${skip_rearm_hour}:${skip_rearm_minute}, then every 10 min until confirmed,
  # max 6): [rmh2s] and check AUTO (mode bits 0x00). Only while docked: if the
  # mower is awake and not on the charger (fault, out on the lawn), it waits
  # for the next retry. In AUTO outside the work hours it stays on the
  # charger (and stays awake ~25 min, so it charges too).
  - id: skip_rearm
    mode: single
    then:
      - wait_until:
          condition:
            lambda: "return !id(key_sequence).is_running() && !id(timer_apply).is_running() && !id(self_test).is_running() && !id(nightly_topup).is_running();"
          timeout: 300s
      - lambda: |-
          id(skip_attempts) += 1;
          uint8_t s = id(last_state_code);
          id(sk_go) = !id(key_sequence).is_running() &&
                      (!id(automower_aux1_awake).state || s == 0x01 || s == 0x04 || s == 0x00);
          if (id(sk_go)) {
            ESP_LOGI("skip", "Skip Today: back to AUTO (attempt %d)", id(skip_attempts));
            char b[48];
            snprintf(b, sizeof(b), "back to AUTO (attempt %d)...", id(skip_attempts));
            aux1::pub(id(automower_skip), b);
          } else {
            ESP_LOGW("skip", "Skip Today: not docked or busy (state %02X) - retry in 10 min (attempt %d)", s,
                     id(skip_attempts));
            aux1::pub(id(automower_skip), "waiting for the mower to dock - retrying");
          }
      - if:
          condition:
            lambda: "return id(sk_go);"
          then:
            - script.execute: {id: key_sequence, seq: "[rmh2s]"}
            - script.wait: key_sequence
            - lambda: |-
                id(sk_try) = 0;
                id(sk_done) = false;
            - while:
                condition:
                  lambda: "return !id(sk_done);"
                then:
                  - delay: !lambda "return id(sk_try) == 0 ? 2000 : 6000;"
                  - lambda: |-
                      bool last = id(sk_try) >= 1;
                      id(sk_try) += 1;
                      auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
                      if (l.ok) {
                        if (l.next_set) aux1::pub(id(automower_next_start), aux1::fmt_mower_time(l.next));
                        else aux1::pub(id(automower_next_start), aux1::timer_bits(l) == 1 ? "now (in work period)" : "none");
                      }
                      bool ok = l.ok && aux1::mode_bits(l) == 0x00;
                      if (!ok && !last) {
                        ESP_LOGI("skip", "Skip Today: AUTO not confirmed on first read - re-reading");
                        return;
                      }
                      id(sk_done) = true;
                      if (ok) {
                        id(skip_pending) = false;
                        id(skip_due) = false;
                        auto t = id(sntp_time).now();
                        std::string ns = l.next_set ? aux1::fmt_mower_time(l.next) : std::string("now (in work period)");
                        ESP_LOGI("skip", "Skip Today: back in AUTO, next start %s", ns.c_str());
                        aux1::pub(id(automower_skip), "off - back to AUTO " +
                                                          (t.is_valid() ? t.strftime("%a %H:%M") : std::string("")) +
                                                          ", next start " + ns);
                      } else {
                        ESP_LOGW("skip", "Skip Today: AUTO not confirmed (%s) - retry in 10 min",
                                 l.ok ? aux1::hex_dump(l.st, 6).c_str() : "no reply");
                        char b[64];
                        snprintf(b, sizeof(b), "back to AUTO attempt %d not confirmed - retrying", id(skip_attempts));
                        aux1::pub(id(automower_skip), b);
                      }

  # Keypad self test (docked only). Four wrapped sequences, each checked from
  # the long 0x12 frame:
  #   1 [rmh1s]               -> HOME selected, mower docked
  #   2 WH1 = now-1h..now+1h, all days on -> timer "in work period" (stays
  #     docked because HOME is selected)
  #   3 timer_normal          -> timer active again (same state as before the test)
  #   4 [rmh2s]               -> AUTO selected
  # Proves keys, hatch, commit and timer logic; cannot check exact times (the
  # schedule itself isn't readable). On failure it stops; if the timer may
  # have been left changed, the normal timer is restored via timer control.
  # NB: with HOME selected the mower sleeps ~16s after each hatch close, so
  # steps 2-4 usually start with a wake; the key engine replays a sequence
  # once if the mower drops out mid-way.
  - id: self_test
    mode: single
    then:
      - lambda: |-
          id(st_ok) = true;
          id(st_step) = 0;
          id(st_report) = "";
          id(st_prev_timer) = 0xFF;
          if (id(timer_parked)) {
            id(st_ok) = false;
            id(st_report) = "refused: timer is parked - Restore Timer first";
          } else if (aux1::ready()) {
            auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
            if (l.ok && l.st[0] != 0x01 && l.st[0] != 0x04) {
              id(st_ok) = false;
              char b[64];
              snprintf(b, sizeof(b), "refused: mower not docked (state %02X)", l.st[0]);
              id(st_report) = b;
            } else if (l.ok) {
              id(st_prev_timer) = aux1::timer_bits(l);
            }
          }
          ESP_LOGI("selftest", "Self test %s", id(st_ok) ? "starting" : id(st_report).c_str());
          aux1::pub(id(automower_self_test), id(st_ok) ? "running..." : id(st_report));
      - while:
          condition:
            lambda: "return id(st_ok) && id(st_step) < 4;"
          then:
            - lambda: |-
                switch (id(st_step)) {
                  case 0: id(st_seq) = "[rmh1s]"; break;
                  case 1: {
                    auto t = id(sntp_time).now();
                    int now_m = t.is_valid() ? t.hour * 60 + t.minute : 12 * 60;
                    int a = std::max(0, now_m - 60), b = std::min(23 * 60 + 59, now_m + 60);
                    char w[48];
                    snprintf(w, sizeof(w), "m11%02d%02d%02d%02do r m138b", a / 60, a % 60, b / 60, b % 60);
                    id(st_seq) = aux1::wrap_sequence(w);
                    break;
                  }
                  case 2: id(st_seq) = aux1::wrap_sequence("${timer_normal}"); break;
                  default: id(st_seq) = "[rmh2s]"; break;
                }
                ESP_LOGI("selftest", "Step %d: %s", id(st_step) + 1, id(st_seq).c_str());
            - wait_until:
                condition:
                  lambda: "return !id(key_sequence).is_running();"
                timeout: 120s
            - script.execute:
                id: key_sequence
                seq: !lambda "return id(st_seq);"
            - script.wait: key_sequence
            - delay: 2s
            - lambda: |-
                auto l = aux1::read_long_status(id(aux1_uart), id(automower_pin_global));
                bool ok = false;
                char b[80];
                uint8_t tb = l.ok ? aux1::timer_bits(l) : 0xFF;
                switch (id(st_step)) {
                  case 0:
                    ok = l.ok && aux1::mode_bits(l) == 0x20 && (l.st[0] == 0x01 || l.st[0] == 0x04);
                    snprintf(b, sizeof(b), "1 HOME %s", ok ? "ok" : "FAIL");
                    break;
                  case 1:
                    ok = l.ok && tb == 0x01;
                    snprintf(b, sizeof(b), "2 window %s", ok ? "ok" : "FAIL");
                    break;
                  case 2:
                    ok = l.ok && (tb == 0x01 || (tb == 0x02 && l.next_set)) &&
                         (id(st_prev_timer) == 0xFF || tb == id(st_prev_timer));
                    snprintf(b, sizeof(b), "3 restore %s (next %s)", ok ? "ok" : "FAIL",
                             l.next_set ? aux1::fmt_mower_time(l.next).c_str() : "now");
                    break;
                  default:
                    ok = l.ok && aux1::mode_bits(l) == 0x00;
                    snprintf(b, sizeof(b), "4 AUTO %s", ok ? "ok" : "FAIL");
                    break;
                }
                if (!l.ok) strncat(b, " (no reply)", sizeof(b) - strlen(b) - 1);
                if (id(seq_aborted)) strncat(b, " (keys aborted: mower asleep)", sizeof(b) - strlen(b) - 1);
                ESP_LOGI("selftest", "%s (status %s)", b, l.ok ? aux1::hex_dump(l.st, 6).c_str() : "-");
                if (!id(st_report).empty()) id(st_report) += ", ";
                id(st_report) += b;
                if (!ok) id(st_ok) = false;
                if (l.ok) {
                  if (l.next_set) aux1::pub(id(automower_next_start), aux1::fmt_mower_time(l.next));
                  else aux1::pub(id(automower_next_start), tb == 1 ? "now (in work period)" : "none");
                }
                id(st_step) += 1;
      - lambda: |-
          auto t = id(sntp_time).now();
          std::string when = t.is_valid() ? t.strftime("%a %H:%M") : std::string("?");
          bool pass = id(st_ok) && id(st_step) >= 4;
          // Timer touched but not confirmed restored (failed in step 2 or 3): hand
          // the restore to timer control, which retries every 10 min.
          bool restore = !id(st_ok) && (id(st_step) == 2 || id(st_step) == 3);
          std::string res = std::string(pass ? "PASS " : "FAIL ") + when + ": " + id(st_report);
          if (!pass && id(st_step) >= 1) res += " - HOME left selected";
          if (restore) {
            id(timer_parked) = true;
            id(restore_due) = true;
            id(restore_attempts) = 0;
            res += "; restoring normal timer";
          }
          ESP_LOGI("selftest", "%s", res.c_str());
          aux1::pub(id(automower_self_test), res);
      - if:
          condition:
            lambda: "return id(restore_due) && id(timer_parked) && !id(st_ok);"
          then:
            - script.execute: {id: timer_apply, park: false}

  # Plays a key sequence (see language above). mode: single - a second
  # request while one is playing is rejected with a log warning.
  # Standby guard (5 Oct): if the hatch is open but AUX1 has dropped, the
  # mower went to standby mid-sequence and further keys would be lost. The
  # hatch is closed and the whole sequence replayed once from its '[' (which
  # then waits for the wake); if it drops again, the sequence is aborted.
  - id: key_sequence
    mode: single
    parameters:
      seq: string
    then:
      - lambda: |-
          std::string out;
          for (char ch : seq) {
            char c = tolower((unsigned char) ch);
            if (c == 'e') out += "rmx";
            else if (c != ' ') out += c;
          }
          id(key_buffer) = out;
          id(key_index) = 0;
          id(seq_replays) = 0;
          id(seq_aborted) = false;
          if (out.find('x') != std::string::npos && id(aux1_polling).state) {
            id(aux1_polling).turn_off();
            ESP_LOGW("keypad", "Tools/EXP entry - AUX1 polling paused. Re-enable 'AUX1 Polling' after leaving that menu.");
          }
          ESP_LOGI("keypad", "Sequence '%s'", out.c_str());
      - while:
          condition:
            lambda: "return id(key_index) < (int) id(key_buffer).size();"
          then:
            - lambda: |-
                switch_::Switch *digit[10] = {
                    id(keypad_digit_0), id(keypad_digit_1), id(keypad_digit_2), id(keypad_digit_3),
                    id(keypad_digit_4), id(keypad_digit_5), id(keypad_digit_6), id(keypad_digit_7),
                    id(keypad_digit_8), id(keypad_digit_9)};
                char c = id(key_buffer)[id(key_index)];
                uint32_t hold = ${key_press_ms};
                uint32_t gap = ${key_gap_ms};
                // Standby guard (see above). Not applied to '[' itself, which
                // handles a sleeping mower with the wake wait.
                if (c != '[' && id(automower_hatch).state && !id(automower_aux1_awake).state) {
                  id(automower_hatch).turn_off();
                  if (id(seq_replays) < 1 && id(key_buffer)[0] == '[') {
                    id(seq_replays) += 1;
                    ESP_LOGW("keypad", "Mower dropped to standby mid-sequence (at key %d) - replaying from the start",
                             id(key_index));
                    id(key_index) = -1;   // +1 below -> 0, i.e. the '[' again
                  } else {
                    ESP_LOGW("keypad", "Mower dropped to standby mid-sequence (at key %d) - sequence ABORTED",
                             id(key_index));
                    id(seq_aborted) = true;
                    id(key_index) = (int) id(key_buffer).size();  // ends the loop
                  }
                  id(key_hold_now) = 0;
                  id(key_gap_now) = ${hatch_settle_ms};
                  return;
                }
                if (c >= '0' && c <= '9') digit[c - '0']->turn_on();
                else if (c == 'm') id(keypad_next).turn_on();
                else if (c == 'o') id(keypad_ok).turn_on();
                else if (c == 'b') id(keypad_back).turn_on();
                else if (c == 's') id(keypad_start).turn_on();
                else if (c == 'h') id(keypad_home).turn_on();
                else if (c == 'r') { id(keypad_home).turn_on(); hold = ${key_hold_ms}; }
                else if (c == 'x') { id(keypad_digit_7).turn_on(); id(keypad_digit_9).turn_on(); hold = ${key_hold_ms}; }
                else if (c == '[') {
                  bool asleep = !id(automower_aux1_awake).state;
                  id(automower_hatch).turn_on();
                  hold = 0;
                  gap = asleep ? ${hatch_settle_ms} + ${wake_wait_ms} : ${hatch_settle_ms};
                  if (asleep) ESP_LOGI("keypad", "Mower in standby - waiting %ums for the screen", (unsigned) gap);
                }
                else if (c == ']') { id(automower_hatch).turn_off(); hold = 0; gap = ${hatch_settle_ms}; }
                else if (c == 'w') { hold = 0; }
                else { ESP_LOGW("keypad", "Skipping unknown key '%c'", c); hold = 0; gap = 0; }
                if (hold > 0) ESP_LOGD("keypad", "Key '%c' %ums", c, (unsigned) hold);
                id(key_hold_now) = hold;
                id(key_gap_now) = gap;
            - delay: !lambda "return id(key_hold_now);"
            - script.execute: release_keys
            - delay: !lambda "return id(key_gap_now);"
            - lambda: "id(key_index) += 1;"
      - lambda: |-
          if (id(seq_aborted)) ESP_LOGW("keypad", "Sequence aborted");
          else ESP_LOGD("keypad", "Sequence done%s", id(seq_replays) ? " (after a replay)" : "");

  - id: release_keys
    mode: restart
    then:
      - lambda: |-
          switch_::Switch *all[] = {
              id(keypad_digit_0), id(keypad_digit_1), id(keypad_digit_2), id(keypad_digit_3),
              id(keypad_digit_4), id(keypad_digit_5), id(keypad_digit_6), id(keypad_digit_7),
              id(keypad_digit_8), id(keypad_digit_9), id(keypad_start), id(keypad_home),
              id(keypad_next), id(keypad_back), id(keypad_ok)};
          for (auto *sw : all) if (sw->state) sw->turn_off();

  # Reads the mower's last event record (0x18 [05 01]) and publishes it as
  # Automower Last Fault. Record: [mower time 4 LE][code][5 more bytes, TBD].
  # Code = Husqvarna fault number: 2 and 15 confirmed (30 Sep, 5 Oct); the
  # others are from the Husqvarna G3 list and marked '?' until seen on screen.
  - id: read_last_fault
    mode: restart
    then:
      - delay: 3s   # the record is written a few seconds before 0x12 shows the fault
      - lambda: |-
          if (!aux1::ready()) { ESP_LOGW("fault", "Last fault: AUX1 not ready - not read"); return; }
          uint8_t d[2] = {0x05, 0x01};
          uint8_t r[32];
          size_t len = aux1::send_command_authed(id(aux1_uart), 0x18, d, 2, r, sizeof(r), id(automower_pin_global));
          size_t n = aux1::payload_len(r, len);
          if (aux1::status_byte(r, len) != 0x00 || n < 5) { ESP_LOGW("fault", "Last fault: read failed"); return; }
          const uint8_t *p = aux1::payload(r);
          uint32_t ts = (uint32_t) p[0] | (uint32_t) p[1] << 8 | (uint32_t) p[2] << 16 | (uint32_t) p[3] << 24;
          uint8_t code = p[4];
          const char *name;
          switch (code) {
            case 1:  name = "Outside working area?"; break;
            case 2:  name = "No loop signal"; break;
            case 9:  name = "Trapped?"; break;
            case 10: name = "Upside down?"; break;
            case 11: name = "Low battery?"; break;
            case 12: name = "Empty battery?"; break;
            case 13: name = "No drive?"; break;
            case 15: name = "Mower lifted"; break;
            case 19: name = "Collision sensor problem?"; break;
            default: name = "unknown"; break;
          }
          char b[96];
          snprintf(b, sizeof(b), "%s - code %u %s", aux1::fmt_mower_time(ts).c_str(), (unsigned) code, name);
          ESP_LOGI("fault", "Last fault: %s (record %s)", b, aux1::hex_dump(p, n).c_str());
          aux1::pub(id(automower_last_fault), b);

  - id: send_raw_query
    mode: single
    then:
      - lambda: |-
          std::string in = id(automower_raw_query).state;
          std::vector<uint8_t> b;
          size_t pos = 0;
          while (pos < in.size()) {
            size_t sp = in.find(' ', pos);
            std::string tok = in.substr(pos, sp == std::string::npos ? std::string::npos : sp - pos);
            if (!tok.empty()) b.push_back((uint8_t) strtol(tok.c_str(), nullptr, 16));
            if (sp == std::string::npos) break;
            pos = sp + 1;
          }
          if (b.empty() || b.size() > 17) {
            ESP_LOGW("automower", "Raw query: need 1-17 hex bytes, got '%s'", in.c_str());
            return;
          }
          if (!aux1::ready()) {
            ESP_LOGW("automower", "Raw query: AUX1 not ready (standby, start-up hold-off, or polling paused)");
            id(automower_raw_response).publish_state("not ready");
            return;
          }
          uint8_t cmd = b[0];
          uint8_t len_d = b.size() - 1;
          size_t expected = 0;
          if (cmd == 0x14 && len_d >= 1) expected = (b[1] == 0x01) ? 26 : (b[1] == 0x04) ? 17 : 0;
          uint8_t r[32];
          size_t len = aux1::send_command_authed(id(aux1_uart), cmd, len_d ? &b[1] : nullptr, len_d, r, sizeof(r),
                                                 id(automower_pin_global), expected);
          std::string out = len ? aux1::hex_dump(r, len) : std::string("no reply");
          ESP_LOGI("automower", "Raw query 0x%02X -> %s", cmd, out.c_str());
          // Time first, so a fresh reply is easy to tell from an old one.
          auto t = id(sntp_time).now();
          id(automower_raw_response).publish_state((t.is_valid() ? t.strftime("%H:%M:%S ") : std::string("")) + out);